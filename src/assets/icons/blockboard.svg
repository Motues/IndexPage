<svg width="290" height="290" viewBox="0 0 290 290" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景已移除，默认为透明 -->

  <!-- 第一行 (坐标从 0 开始，完全贴边) -->
  <rect x="0" y="0" width="90" height="90" rx="16" fill="#e7e7eb" />
  <rect x="100" y="0" width="90" height="90" rx="16" fill="#62c976" /> <!-- 绿色 -->
  <rect x="200" y="0" width="90" height="90" rx="16" fill="#e7e7eb" />

  <!-- 第二行 -->
  <rect x="0" y="100" width="90" height="90" rx="16" fill="#cf8e15" />
  <rect x="100" y="100" width="90" height="90" rx="16" fill="#e7e7eb" />
  <rect x="200" y="100" width="90" height="90" rx="16" fill="#599bfc" /> <!-- 蓝色 -->

  <!-- 第三行 -->
  <rect x="0" y="200" width="90" height="90" rx="16" fill="#e7e7eb" /> <!-- 黄色 -->
  <rect x="100" y="200" width="90" height="90" rx="16" fill="#e7e7eb" />
  <rect x="200" y="200" width="90" height="90" rx="16" fill="#c084fc" /> <!-- 浅紫色 -->
</svg>